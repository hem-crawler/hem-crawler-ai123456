name: HEM v1.6.1 Auto Crawler

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run crawler
        run: python crawler_v1.6.1.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawler-output
          path: v1.6.1_crawler_output.csvadd workflow
